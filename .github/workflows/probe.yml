name: probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read | panel"
        required: true
        default: read

concurrency:
  group: probe-${{ github.event.inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          cd probe
          npm init -y >/dev/null 2>&1
          npm i --silent --no-audit --no-fund playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          echo "runner ip: $(curl -fsS -m 10 https://api.ipify.org || echo ?)"
      - name: read
        if: ${{ github.event.inputs.mode == 'read' }}
        run: node probe/read.mjs
      - name: panel
        if: ${{ github.event.inputs.mode == 'panel' }}
        env:
          TOROB_COOKIES: ${{ secrets.TOROB_COOKIES }}
        run: |
          [ -n "$TOROB_COOKIES" ] || { echo "secret TOROB_COOKIES is not set"; exit 1; }
          node probe/panel.mjs
