name: panel-relay

# Tehran time (UTC+3:30) windows: 06:00, 09:30, 12:30, 15:30, 18:30, 21:30.
# GitHub often starts scheduled runs late or skips them, so each window has several attempts;
# the worker refuses a second session within 120 minutes, so extra attempts exit in seconds.
# After every completed "check" run we also try once (AUTO=1): it only starts a session if no relay
# ran in the last 150 minutes and it is 06:00-22:59 in Tehran.
on:
  schedule:
    - cron: '17,27,42,57 2 * * *'
    - cron: '47,57 5,8,11,14,17 * * *'
    - cron: '12,27 6,9,12,15,18 * * *'
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [relay/run-now.txt]

concurrency:
  group: panel-relay
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          cd relay
          npm init -y >/dev/null 2>&1
          npm i --silent --no-audit --no-fund playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: relay
        env:
          W: https://torob-browser-connector.shazdeh-2009.workers.dev
          DUR_MIN: ${{ github.event_name == 'push' && '8' || '45' }}
          AUTO: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          node relay/relay.mjs > /tmp/relay.log 2>&1; rc=$?
          cat /tmp/relay.log
          if [ $rc -ne 0 ]; then
            { echo "rc=$rc node=$(node -v) ev=${{ github.event_name }}"; tail -c 600 /tmp/relay.log; } | curl -sS -m 10 -X POST --data-binary @- "$W/gh-diag" || true
          fi
          exit $rc
